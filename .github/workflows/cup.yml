name: Re-Mind Cup nightly scoring
on:
  schedule:
    - cron: "37 20 * * *"   # 02:07 IST
  workflow_dispatch: {}
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Score all entries on hidden students
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CUP_SEED: ${{ secrets.CUP_SEED }}
        run: python cup/evaluate.py --supabase
